<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Harmonium app icon</title>
  <desc id="desc">A stylized wooden harmonium with brass stops and an ivory keyboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c98b57"/>
      <stop offset="0.38" stop-color="#915730"/>
      <stop offset="1" stop-color="#2a160e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#a86e45"/>
      <stop offset="1" stop-color="#4a2819"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f5db92"/>
      <stop offset="0.5" stop-color="#d3a345"/>
      <stop offset="1" stop-color="#fff0bb"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#e4cda1"/>
    </linearGradient>
    <linearGradient id="ebony" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2f1a12"/>
      <stop offset="1" stop-color="#050303"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#1a0e09"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="url(#bg)"/>
  <rect x="30" y="30" width="452" height="452" rx="88" fill="none" stroke="#e7bf83" stroke-opacity="0.42" stroke-width="3"/>

  <rect x="50" y="54" width="412" height="404" rx="68" fill="url(#panel)" stroke="#f0cf99" stroke-opacity="0.14" stroke-width="2"/>
  <rect x="72" y="78" width="368" height="74" rx="34" fill="#4c2a1b" opacity="0.95"/>
  <rect x="98" y="98" width="316" height="34" rx="17" fill="url(#brass)" opacity="0.96"/>

  <g filter="url(#shadow)">
    <g transform="translate(0 4)">
      <circle cx="156" cy="186" r="22" fill="url(#brass)"/>
      <circle cx="256" cy="186" r="22" fill="url(#brass)"/>
      <circle cx="356" cy="186" r="22" fill="url(#brass)"/>
      <circle cx="156" cy="186" r="9" fill="#7f5923" opacity="0.38"/>
      <circle cx="256" cy="186" r="9" fill="#7f5923" opacity="0.38"/>
      <circle cx="356" cy="186" r="9" fill="#7f5923" opacity="0.38"/>
    </g>
  </g>

  <rect x="78" y="220" width="356" height="196" rx="34" fill="#2b1710" stroke="#f0d39e" stroke-opacity="0.22" stroke-width="2"/>
  <rect x="96" y="238" width="320" height="162" rx="26" fill="#20110b"/>

  <g transform="translate(102 246)">
    <g fill="url(#ivory)" stroke="#c7ae81" stroke-width="1.5">
      <rect x="0" y="0" width="44" height="156" rx="16"/>
      <rect x="44" y="0" width="44" height="156" rx="16"/>
      <rect x="88" y="0" width="44" height="156" rx="16"/>
      <rect x="132" y="0" width="44" height="156" rx="16"/>
      <rect x="176" y="0" width="44" height="156" rx="16"/>
      <rect x="220" y="0" width="44" height="156" rx="16"/>
      <rect x="264" y="0" width="44" height="156" rx="16"/>
    </g>

    <g fill="url(#ebony)">
      <rect x="30" y="0" width="28" height="92" rx="12"/>
      <rect x="74" y="0" width="28" height="92" rx="12"/>
      <rect x="162" y="0" width="28" height="92" rx="12"/>
      <rect x="206" y="0" width="28" height="92" rx="12"/>
      <rect x="250" y="0" width="28" height="92" rx="12"/>
    </g>
  </g>

  <path d="M84 428h344" stroke="url(#brass)" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
</svg>
